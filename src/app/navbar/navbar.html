<header class="site-header">
  <nav class="nav-shell">
    <a class="brand" routerLink="/" aria-label="Go to home page">
      <img class="brand-mark" src="assets/jdsuiteflat.png" alt="" />
    </a>

    <div class="nav-links">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        aria-label="Go to home page"
      >Home</a>
      <a routerLink="/journal" 
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"

      <a routerLink="/projects" 
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"

        aria-label="Go to Projects page"
      >Projects</a>
      <a routerLink="/systems" 
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        aria-label="Go to Systems page"
      >Systems</a>
      <a routerLink="/about" 
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        aria-label="Go to About page"
      >About</a>
    </div>

    <a class="nav-cta" href="#"
        routerLink="/theLab" 
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        aria-label="Go to Lab page"
      >Enter The Lab</a>
